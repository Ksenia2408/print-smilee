<style>

.hero{display:grid;gap:28px;align-items:center;padding:44px 20px 24px;max-width:1100px;margin:0 auto}

.tee.b .body{fill:#151515}.tee.w .body{fill:#fafafa}
.tee.b text{fill:#f4f4f4}.tee.w text{fill:#111}
.tee text{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;transition:opacity .3s}
.tee text.in{animation:prt 1.2s ease backwards}

.stage{position:relative;container-type:inline-size}
.ov{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);max-width:82%;text-align:center;line-height:1.05;font-size:calc(var(--fs,8)*1cqw);white-space:pre-wrap;overflow-wrap:anywhere;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:2px 6px;border:1px dashed transparent;border-radius:4px}
.ov:hover,.ov:focus-visible,.ov.drag{border-color:currentColor}.ov.drag{cursor:grabbing}
.ovi{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:calc(var(--is,30)*1%);height:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;border:1px dashed transparent;border-radius:3px}
.ovi:hover,.ovi:focus-visible,.ovi.drag{border-color:rgba(128,128,128,.9)}.ovi.drag{cursor:grabbing}
input[type=range]{padding:0;border:0;background:none}

</style>

<header>

<div id="shop">
<section class="hero">
  <div>

<script>
const URL_="https://yqqgvqotfsqffglbzffu.supabase.co";
const KEY="sb_publishable_g6spgNufwnb2PowaGRcagg_csEeicbS";
const TG="KseniaLevanova";
const tgLink=t=>"https://t.me/"+TG+(t?"?text="+encodeURIComponent(t):"");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>Number(n).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" ₽";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
let P=[],R=[],filter="all",curP=null,tab=0,A={P:[],R:[]};

/* ---------- сессия администратора ---------- */
const getS=()=>{try{return JSON.parse(localStorage.getItem("ps_s")||"null")}catch(e){return null}};
const setS=s=>{try{s?localStorage.setItem("ps_s",JSON.stringify(s)):localStorage.removeItem("ps_s")}catch(e){}};
async function token(){
  let s=getS(); if(!s)return null;
  if(s.exp-Date.now()<60000){
    try{const r=await fetch(URL_+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.rt})});
      if(!r.ok)throw 0;const j=await r.json();s={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:s.email};setS(s)}
    catch(e){setS(null);return null}
  }
  return s.at;
}
async function api(path,o={}){
  const h={apikey:KEY,...(o.headers||{})};
  if(o.auth){const t=await token();if(!t)throw new Error("auth");h.Authorization="Bearer "+t}
  if(o.body!==undefined)h["Content-Type"]="application/json";
  const r=await fetch(URL_+path,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  if(!r.ok)throw new Error(await r.text()||r.status);
  return (r.headers.get("content-type")||"").includes("json")?r.json():null;
}
const MIN={Prefer:"return=minimal"};

/* ---------- витрина ---------- */
const prod=id=>P.find(p=>p.id===id);
const revs=id=>R.filter(r=>r.product_id===id);
const avg=id=>{const r=revs(id);return r.length?r.reduce((a,x)=>a+x.rating,0)/r.length:0};
async function loadShop(){
  try{[P,R]=await Promise.all([api("/rest/v1/products?select=*&hidden=eq.false&order=created_at.desc"),api("/rest/v1/reviews?select=*&approved=eq.true&order=created_at.desc")]);$("loaderr").hidden=true}
  catch(e){$("loaderr").hidden=false}
  renderGrid();
}
function renderGrid(){
  $("grid").innerHTML=P.filter(p=>filter==="all"||(filter==="kids"?p.kids:p.color===filter)).map(p=>{const a=avg(p.id);
   return `<article class="card"><button class="pic" data-act="open" data-id="${p.id}" aria-label="Открыть: ${esc(p.title)}"><img src="${esc(p.image_url)}" alt="Футболка «${esc(p.title)}»" loading="lazy"></button>
   <h3>${esc(p.title)}</h3><p class="sub">${esc(p.subtitle)}, ${p.color==="black"?"чёрная":"белая"}${p.kids?", детская":""}${a?`, ${a.toFixed(1)} ★`:""}</p>
   <div class="row"><span class="price">${rub(p.price)}</span><button class="add" data-act="open" data-id="${p.id}">Выбрать</button></div></article>`}).join("")||(P.length||!$("loaderr").hidden?"":'<p class="empty">Каталог скоро пополнится.</p>');
}
const closeModals=()=>$("pm").classList.remove("on");

function openP(id){
  const p=prod(id);if(!p)return;curP=id;const rv=revs(id),a=avg(id);
  $("pmb").innerHTML=`<button class="x close" data-act="closem" aria-label="Закрыть">×</button><div class="stage" id="stg"><img class="big" src="${esc(p.image_url)}" alt="Футболка «${esc(p.title)}»"><img class="ovi" id="ovi" tabindex="0" hidden alt="Ваша картинка. Стрелками можно сдвинуть."><div class="ov" id="ov" tabindex="0" hidden role="img" aria-label="Надпись на футболке. Стрелками можно сдвинуть."></div></div>
  <div class="pi"><h2>${esc(p.title)}</h2><p class="sub">${esc(p.subtitle)}, ${p.color==="black"?"чёрная":"белая"}${p.kids?", детская":""}</p>
  <div class="row"><span class="price">${rub(p.price)}</span></div>${cfgHTML(p)}
  <h3 style="margin:22px 0 4px">Отзывы${rv.length?` (${rv.length}), средняя оценка ${a.toFixed(1)}`:""}</h3>
  ${rv.map(r=>`<div class="rv"><span class="st" aria-label="Оценка ${r.rating} из 5">${stars(r.rating)}</span> <b>${esc(r.author)}</b><p>${esc(r.body)}</p></div>`).join("")||'<p class="sub">Пока нет отзывов. Будьте первым.</p>'}
  <div class="rf" id="rf"><input id="rn" placeholder="Ваше имя" maxlength="40"><select id="rr" aria-label="Оценка"><option value="5">5, отлично</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><textarea id="rt" rows="3" maxlength="600" placeholder="Что вам понравилось?"></textarea><div class="err" id="re" role="alert"></div><button class="go" data-act="rsend" style="margin:0">Отправить отзыв</button></div></div>`;
  initCfg();$("pm").classList.add("on");
}
/* ---------- примерка надписи и заказ в Telegram ---------- */
const SIZES={kids:["92","98","104","110","116","122","128"],adult:["S","M","L","XL","XXL"]};
const FONTS=[{n:"Классика",f:"'Cormorant Garamond',Georgia,serif",s:"italic",w:500},{n:"Строгий",f:"Manrope,sans-serif",s:"normal",w:700},{n:"От руки",f:"Caveat,cursive",s:"normal",w:600}];
const COLS=[["Белый","#ffffff"],["Чёрный","#111111"],["Золотой","#c9a24a"]];
let O={};
function cfgHTML(p){
  if(O.img)URL.revokeObjectURL(O.img);
  O={size:"",text:"",font:0,col:p.color==="black"?"#ffffff":"#111111",x:50,y:72,ix:50,iy:42,is:30,img:""};
  const sz=p.kids?SIZES.kids:SIZES.adult;
  return `<div class="cfg"><span class="lbl">${p.kids?"Размер (рост, см)":"Размер"}</span>
  <div class="chips" role="group" aria-label="Размер">${sz.map(v=>`<button class="chip" data-act="osize" data-v="${v}" aria-pressed="false">${v}</button>`).join("")}</div>
  <label class="lbl" for="ot">Имя или текст на принте</label>
  <input id="ot" maxlength="40" placeholder="Например: Саша" autocomplete="off">
  <span class="lbl">Шрифт</span>
  <div class="chips" role="group" aria-label="Шрифт">${FONTS.map((f,i)=>`<button class="chip" data-act="ofont" data-v="${i}" aria-pressed="${i===0}" style="font-family:${f.f};font-style:${f.s};font-size:16px">${f.n}</button>`).join("")}</div>
  <span class="lbl">Цвет надписи</span>
  <div class="chips" role="group" aria-label="Цвет надписи">${COLS.map(c=>`<button class="swb" data-act="ocol" data-v="${c[1]}" aria-label="${c[0]}" aria-pressed="${c[1]===O.col}" style="background:${c[1]}"></button>`).join("")}</div>
  <label class="lbl" for="oi">Своя картинка</label>
  <input type="file" id="oi" accept="image/*">
  <p class="tag" style="margin:6px 0 0">Она остаётся только на вашем экране. После заказа отправьте её нам в Telegram следующим сообщением.</p>
  <div id="oimg" hidden><label class="lbl" for="osz">Размер картинки</label><input type="range" id="osz" min="10" max="90" value="30"><button class="rm" data-act="oirm" style="margin:8px 0 0">Убрать картинку</button></div>
  <p class="tag" style="margin:12px 0 0">Надпись и картинку можно перетащить по фото. Это примерный вид: точное место и шрифт согласуем в Telegram.</p>
  <div class="err" id="oe" role="alert"></div>
  <a class="go" id="ordb" data-act="order" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:6px">Заказать в Telegram</a></div>`;
}
function ovUpd(){const o=$("ov");if(!o)return;const f=FONTS[O.font],t=O.text.trim();o.hidden=!t;o.textContent=O.text;
  Object.assign(o.style,{fontFamily:f.f,fontStyle:f.s,fontWeight:f.w,color:O.col,left:O.x+"%",top:O.y+"%"});
  o.style.setProperty("--fs",Math.max(4.5,Math.min(11,64/Math.max(t.length,6))))}
function ordUpd(){const p=prod(curP),a=$("ordb");if(!p||!a)return;const t=O.text.trim();
  const msg="Здравствуйте! Хочу заказать футболку «"+p.title+"» ("+rub(p.price)+").\nРазмер: "+(O.size||"—")+
    (t?"\nТекст на принте: «"+t+"»\nШрифт: "+FONTS[O.font].n+"\nЦвет надписи: "+(COLS.find(c=>c[1]===O.col)||COLS[0])[0].toLowerCase():"")+
    (O.img?"\nКартинку отправлю следующим сообщением.":"")+
    "\nМакет: "+location.origin+location.pathname+"#shirt-"+p.id;
  a.href=tgLink(msg)}
function initCfg(){
  const stg=$("stg");if(!stg)return;
  const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
  const mk=(el,kx,ky)=>{
    const put=()=>{el.style.left=O[kx]+"%";el.style.top=O[ky]+"%"};
    el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add("drag")});
    el.addEventListener("pointermove",e=>{if(!el.hasPointerCapture(e.pointerId))return;const r=stg.getBoundingClientRect();
      O[kx]=cl((e.clientX-r.left)/r.width*100,4,96);O[ky]=cl((e.clientY-r.top)/r.height*100,4,96);put()});
    el.addEventListener("pointerup",()=>el.classList.remove("drag"));
    el.addEventListener("keydown",e=>{const m={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key];
      if(m){e.preventDefault();O[kx]=cl(O[kx]+m[0],4,96);O[ky]=cl(O[ky]+m[1],4,96);put()}});
  };
  mk($("ov"),"x","y");mk($("ovi"),"ix","iy");
  $("ovi").addEventListener("error",()=>{if(!O.img)return;URL.revokeObjectURL(O.img);O.img="";imgUpd();$("oe").textContent="Не удалось открыть картинку. Попробуйте JPG или PNG."});
  ovUpd();imgUpd();
}
function imgUpd(){const i=$("ovi");if(!i)return;
  if(O.img&&i.getAttribute("src")!==O.img)i.src=O.img;
  if(!O.img)i.removeAttribute("src");
  i.hidden=!O.img;i.style.setProperty("--is",O.is);i.style.left=O.ix+"%";i.style.top=O.iy+"%";$("oimg").hidden=!O.img;ordUpd()}
function setImg(f){const e=$("oe");e.textContent="";if(!f)return;
  if(!/^image\//.test(f.type)){e.textContent="Выберите файл-картинку.";return}
  if(f.size>20e6){e.textContent="Картинка слишком большая, нужна до 20 МБ.";return}
  if(O.img)URL.revokeObjectURL(O.img);O.img=URL.createObjectURL(f);imgUpd()}
const press=t=>t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));
let HP=["Аня","Лучший папа","Саша 2026","Наша команда"],heroI=0,heroT=0;
function heroShow(){const tee=$("tee"),tx=$("teetx");if(!tee||!tx)return;if(heroI>=HP.length)heroI=0;const t=HP[heroI];
  tee.setAttribute("class","tee "+(heroI%2?"w":"b"));tx.textContent=t;
  tx.setAttribute("font-size",Math.max(17,Math.min(44,340/Math.max(t.length,1))));
  tx.classList.remove("in");tx.getBoundingClientRect();tx.classList.add("in");tx.style.opacity=""}
async function heroTee(){
  heroShow();
  try{const r=await api("/rest/v1/settings?key=eq.hero_phrases&select=value");
    const v=r&&r[0]&&r[0].value;if(Array.isArray(v)&&v.length){HP=v.map(String).filter(Boolean).slice(0,8);heroI=0;heroShow()}}catch(e){}
  if(matchMedia("(prefers-reduced-motion:reduce)").matches||heroT)return;
  heroT=setInterval(()=>{if(document.hidden||$("shop").hidden||HP.length<2)return;$("teetx").style.opacity=0;setTimeout(()=>{heroI=(heroI+1)%HP.length;heroShow()},350)},4200);
}
async function sendReview(){
  const author=$("rn").value.trim(),body=$("rt").value.trim();
  if(!author||body.length<3){$("re").textContent="Укажите имя и напишите пару слов об отзыве.";return}
  try{await api("/rest/v1/reviews",{method:"POST",headers:MIN,body:{product_id:curP,author,rating:+$("rr").value,body,approved:false}});
    $("rf").innerHTML='<p class="sub">Спасибо! Отзыв появится на сайте после проверки.</p>'}
  catch(e){$("re").textContent="Не удалось отправить отзыв. Попробуйте позже."}
}
/* ---------- администратор ---------- */
function renderLogin(msg){
  $("adminView").innerHTML=`<h2 style="font:italic 500 32px 'Cormorant Garamond',Georgia,serif;margin:10px 0 14px">Вход для администратора</h2>
  <div class="addp" style="max-width:380px"><input id="le" type="email" placeholder="Почта" autocomplete="username"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="lerr" role="alert">${esc(msg||"")}</div><button class="go" style="margin:0" data-act="login">Войти</button></div>`;
}
async function login(){
  try{const r=await fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("le").value.trim(),password:$("lp").value})});
    const j=await r.json();if(!r.ok)throw 0;
    setS({at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:j.user&&j.user.email});route()}
  catch(e){$("lerr").textContent="Не удалось войти. Проверьте почту и пароль."}
}
async function loadAdmin(){
  try{[A.P,A.R]=await Promise.all([api("/rest/v1/products?select=*&order=created_at.desc",{auth:true}),api("/rest/v1/reviews?select=*&order=created_at.desc",{auth:true})]);return true}
  catch(e){setS(null);return false}
}
const ptitle=id=>(A.P.find(p=>p.id===id)||{title:"удалённой футболке"}).title;
function renderAdmin(note){
  const newR=A.R.filter(r=>!r.approved).length;
  let b="";
  if(tab===0){
    b=`<div class="addp"><h3>Новая футболка</h3><input type="file" id="nf" accept="image/*" aria-label="Фото"><input id="nt" placeholder="Название"><input id="ns" placeholder="Подпись, например: Именной принт"><div class="two"><select id="nc"><option value="black">Чёрная</option><option value="white">Белая</option></select><input id="np" type="number" min="0" value="3000" aria-label="Цена"><label class="ck"><input type="checkbox" id="nk">детская</label></div><div class="err" id="ae" role="alert"></div><button class="go" style="margin:0" data-act="padd">Добавить в каталог</button></div>`+
    A.P.map(p=>`<div class="ar"><img src="${esc(p.image_url)}" alt=""><div><input data-f="title" data-id="${p.id}" value="${esc(p.title)}" aria-label="Название"><div class="two"><input data-f="price" data-id="${p.id}" type="number" min="0" value="${p.price}" aria-label="Цена"><label class="ck"><input type="checkbox" data-f="hidden" data-id="${p.id}"${p.hidden?" checked":""}>скрыть</label><label class="ck"><input type="checkbox" data-f="kids" data-id="${p.id}"${p.kids?" checked":""}>детская</label></div></div><button class="rm" data-act="pdel" data-id="${p.id}">Удалить</button></div>`).join("");
  }else if(tab===1){
    b=A.R.map(r=>`<div class="rv"><span class="st">${stars(r.rating)}</span> <b>${esc(r.author)}</b> <span class="tag">о «${esc(ptitle(r.product_id))}», ${r.approved?"на сайте":"ждёт проверки"}</span><p>${esc(r.body)}</p>
    <div class="two">${r.approved?"":`<button class="add" data-act="rok" data-id="${r.id}">Показать на сайте</button>`}<button class="rm" data-act="rdel" data-id="${r.id}">Удалить</button></div></div>`).join("")||'<p class="sub">Отзывов пока нет.</p>';
  }else{
    b=`<div class="addp"><h3>Надписи на футболке на главной</h3><p class="tag">По одной надписи в строке, до 8 штук, до 24 символов. Цвет футболки меняется по очереди с чёрного на белый.</p><textarea id="hp" rows="6" aria-label="Надписи">${esc(HP.join("\n"))}</textarea><div class="err" id="he" role="alert"></div><button class="go" style="margin:0" data-act="hsave">Сохранить</button></div>`;
  }
  $("adminView").innerHTML=`<h2 style="font:italic 500 32px 'Cormorant Garamond',Georgia,serif;margin:10px 0 14px">Управление</h2>
  <div class="tabs">${["Товары","Отзывы"+(newR?` (${newR})`:""),"Главная"].map((t,i)=>`<button class="chip" data-act="tab" data-v="${i}" aria-pressed="${i===tab}">${t}</button>`).join("")}</div>
  <p class="tag" id="note" role="status">${esc(note||"")}</p>${b}`;
}
const readImg=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};im.src=r.result};r.readAsDataURL(f)});
async function upload(blob){
  const t=await token();if(!t)throw new Error("auth");
  const name=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2))+".jpg";
  const r=await fetch(URL_+"/storage/v1/object/products/"+name,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:blob});
  if(!r.ok)throw new Error(await r.text());
  return URL_+"/storage/v1/object/public/products/"+name;
}
const patch=(table,id,body)=>api(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",auth:true,headers:MIN,body});
const del=(table,id)=>api(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",auth:true,headers:MIN});
async function refresh(note){await loadAdmin();renderAdmin(note)}
async function act(d,t){
  try{switch(d.act){
   case"login":await login();break;
   case"tab":tab=+d.v;renderAdmin();break;
   case"padd":{const f=$("nf").files[0],n=$("nt").value.trim();
     if(!f||!n){$("ae").textContent="Выберите фото и введите название.";break}
     t.disabled=true;t.textContent="Загружаем…";
     const url=await upload(await readImg(f));
     await api("/rest/v1/products",{method:"POST",auth:true,headers:MIN,body:{title:n,subtitle:$("ns").value.trim()||"Принт",color:$("nc").value,price:+$("np").value||0,image_url:url,...($("nk").checked?{kids:true}:{})}});
     await refresh("Футболка добавлена");break}
   case"pdel":if(confirm("Удалить футболку из каталога?")){await del("products",d.id);await refresh("Удалено")}break;
   case"rok":await patch("reviews",d.id,{approved:true});await refresh("Отзыв показан на сайте");break;
   case"rdel":if(confirm("Удалить отзыв?")){await del("reviews",d.id);await refresh("Удалено")}break;
   case"hsave":{const v=$("hp").value.split("\n").map(x=>x.trim().slice(0,24)).filter(Boolean).slice(0,8);
     if(!v.length){$("he").textContent="Напишите хотя бы одну надпись.";break}
     try{await api("/rest/v1/settings?on_conflict=key",{method:"POST",auth:true,headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:{key:"hero_phrases",value:v}})}
     catch(x){if(String(x.message)==="auth")throw x;$("he").textContent="Не удалось сохранить. Проверьте, что в Supabase создана таблица settings.";break}
     HP=v;heroI=0;heroShow();renderAdmin("Сохранено");break}
  }}catch(e){
    if(String(e.message)==="auth"){setS(null);route();return}
    renderAdmin("Не получилось: "+String(e.message).slice(0,160));
  }
}

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("modal")){closeModals();return}
  const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,k=+d.k;
  switch(d.act){
   case"open":openP(d.id);break;
   case"closem":closeModals();break;
   case"flt":filter=d.v;document.querySelectorAll(".filters .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===filter));renderGrid();break;
   case"rsend":sendReview();break;
   case"osize":O.size=d.v;press(t);$("oe").textContent="";ordUpd();break;
   case"ofont":O.font=+d.v;press(t);ovUpd();ordUpd();break;
   case"ocol":O.col=d.v;press(t);ovUpd();ordUpd();break;
   case"order":if(!O.size){e.preventDefault();$("oe").textContent="Выберите размер, и откроется Telegram с готовым сообщением."}break;
   case"oirm":if(O.img)URL.revokeObjectURL(O.img);O.img="";$("oi").value="";imgUpd();break;
   case"toshop":document.querySelector(".filters").scrollIntoView({behavior:"smooth"});break;
   default:act(d,t);
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.f&&t.dataset.id){
    const v=(t.dataset.f==="hidden"||t.dataset.f==="kids")?t.checked:t.dataset.f==="price"?(+t.value||0):t.value.trim();
    try{await patch("products",t.dataset.id,{[t.dataset.f]:v});$("note").textContent="Сохранено"}catch(x){$("note").textContent="Не удалось сохранить"}
  }
});
document.addEventListener("input",e=>{const i=e.target.id;
  if(i==="ot"){O.text=e.target.value;ovUpd();ordUpd()}
  else if(i==="osz"){O.is=+e.target.value;$("ovi").style.setProperty("--is",O.is)}});
document.addEventListener("change",e=>{if(e.target.id==="oi")setImg(e.target.files[0])});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModals()}
  if(e.key==="Enter"&&(e.target.id==="le"||e.target.id==="lp"))login();
});
$("out").onclick=()=>{setS(null);location.hash="";route()};

async function route(){
  const adm=location.hash==="#admin";
  $("shop").hidden=adm;$("adminView").hidden=!adm;$("tgbtn").hidden=adm;$("back").hidden=!adm;$("out").hidden=!(adm&&getS());
  closeModals();
  if(adm){
    if(getS()){$("adminView").innerHTML='<p class="sub">Загружаем…</p>';if(await loadAdmin()){$("out").hidden=false;renderAdmin()}else{$("out").hidden=true;renderLogin("Сессия закончилась, войдите снова.")}}
    else renderLogin();
  }else{await loadShop();const m=location.hash.match(/^#shirt-(.+)$/);if(m&&prod(m[1]))openP(m[1])}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("tgbtn").href=tgLink();
heroTee();
route();
</script>
</body>
</html>
