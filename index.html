<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>print.smilee — футболки с принтом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ececec;--surface:#fff;--ink:#111;--mute:#6b6b6b;--line:#d4d4d4;--btn:#111;--btn-ink:#fff;--ph:#cfcfcf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--surface:#1a1a1a;--ink:#f1f1f1;--mute:#9a9a9a;--line:#333;--btn:#f1f1f1;--btn-ink:#111;--ph:#262626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0e;--surface:#1a1a1a;--ink:#f1f1f1;--mute:#9a9a9a;--line:#333;--btn:#f1f1f1;--btn-ink:#111;--ph:#262626;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.logo{font:italic 500 28px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.cartbtn{background:none;border:1px solid var(--ink);color:var(--ink);border-radius:99px;padding:8px 16px;font:600 14px Manrope,sans-serif;cursor:pointer}
.cartbtn b{display:inline-block;min-width:20px;margin-left:6px;background:var(--ink);color:var(--bg);border-radius:99px;font-size:12px;line-height:20px;text-align:center}
.hero{padding:44px 20px 24px;max-width:1100px;margin:0 auto}
.hero h1{font:italic 400 clamp(40px,9vw,84px)/.95 "Cormorant Garamond",Georgia,serif;margin:0 0 14px;max-width:11em}
.hero p{margin:0;color:var(--mute);max-width:34em}
.filters{display:flex;gap:8px;padding:8px 20px 20px;max-width:1100px;margin:0 auto}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:7px 15px;font:500 14px Manrope,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 20px 56px;max-width:1100px;margin:0 auto}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:22px}}
.card{display:flex;flex-direction:column}
.card button.pic{padding:0;border:0;background:var(--ph);aspect-ratio:3/4;overflow:hidden;cursor:pointer;border-radius:4px}
.card img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
.card h3{margin:10px 0 2px;font-size:15px;font-weight:600}
.card .sub{color:var(--mute);font-size:13px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.price{font-weight:600}
.add{background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;padding:8px 14px;font:600 13px Manrope,sans-serif;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.how{border-top:1px solid var(--line);padding:32px 20px 48px;max-width:1100px;margin:0 auto;color:var(--mute)}
.how p{margin:0 0 6px;max-width:40em}
.how strong{color:var(--ink)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:italic 500 26px "Cormorant Garamond",Georgia,serif}
.x{background:none;border:0;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
.db{flex:1;overflow:auto;padding:8px 20px}
.empty{color:var(--mute);padding:24px 0}
.it{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it img{width:64px;height:84px;object-fit:cover;border-radius:3px}
.it h4{margin:0;font-size:14px}
.ctl{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
select,input,textarea{font:400 14px Manrope,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.ctl select{width:auto}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.rm{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font:13px Manrope,sans-serif;text-decoration:underline}
.txt{margin-top:6px}
.df{border-top:1px solid var(--line);padding:16px 20px}
.tot{display:flex;justify-content:space-between;font-weight:600;margin-bottom:12px}
.df label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
.go{width:100%;margin-top:14px;padding:13px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:99px;font:600 15px Manrope,sans-serif;cursor:pointer}
.err{color:#c0392b;font-size:13px;min-height:18px;margin-top:6px}
.done{padding:24px 20px}
.done h3{margin:0 0 8px;font:italic 500 28px "Cormorant Garamond",Georgia,serif}
.done pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.5 Manrope,sans-serif}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal.on{display:block}
.mb{position:relative;background:var(--surface);max-width:520px;margin:0 auto;border-radius:6px;overflow:hidden}
.mb.wide{max-width:720px;padding:20px}
.big{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:50% 45%}
.pi{padding:18px 20px 24px}.pi h2{margin:0 0 2px;font:italic 500 30px "Cormorant Garamond",Georgia,serif}
.close{position:absolute;top:8px;right:8px;background:var(--surface);border-radius:50%;width:36px;height:36px;z-index:1;padding:0}
.rv{border-top:1px solid var(--line);padding:10px 0}.rv p{margin:2px 0 0}
.st{letter-spacing:2px}
.rf{display:grid;gap:8px;margin-top:12px}
.ar{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ar img{width:56px;height:74px;object-fit:cover;border-radius:3px}
.two{display:flex;gap:8px;margin-top:6px;align-items:center}
.ck{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:13px}.ck input{width:auto}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.addp{display:grid;gap:8px;border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.addp h3,.mb h3{margin:0}
.pub{position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 4px}
.tag{font-size:12px;color:var(--mute)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <a class="logo" href="#" style="color:inherit;text-decoration:none">print.smilee</a>
  <span><a id="back" href="#" hidden class="cartbtn" style="text-decoration:none;display:inline-block">← На сайт</a> <button class="cartbtn" id="out" hidden>Выйти</button> <a class="cartbtn" id="tgbtn" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Написать в Telegram</a></span>
</header>

<div id="shop">
<section class="hero">
  <h1>Футболки с вашим принтом</h1>
  <p>Фото, цитаты и имена на плотном хлопке. Выберите макет, а имя или текст на принте мы поменяем под вас.</p>
</section>
<div class="filters" role="group" aria-label="Фильтр по цвету">
  <button class="chip" data-act="flt" data-v="all" aria-pressed="true">Все</button>
  <button class="chip" data-act="flt" data-v="black" aria-pressed="false">Чёрные</button>
  <button class="chip" data-act="flt" data-v="white" aria-pressed="false">Белые</button>
  <button class="chip" data-act="flt" data-v="kids" aria-pressed="false">Детские</button>
</div>
<p class="empty" id="loaderr" hidden style="padding:0 20px;max-width:1100px;margin:0 auto 16px">Не удалось загрузить каталог. Обновите страницу.</p>
<main class="grid" id="grid"></main>
<section class="how">
  <p><strong>Цена.</strong> Указана на каждой футболке.</p>
</section>
</div>

<div id="adminView" hidden style="max-width:760px;margin:0 auto;padding:20px"></div>

<div class="modal" id="pm" role="dialog" aria-modal="true"><div class="mb" id="pmb"></div></div>

<script>
const URL_="https://yqqgvqotfsqffglbzffu.supabase.co";
const KEY="sb_publishable_g6spgNufwnb2PowaGRcagg_csEeicbS";
const TG="KseniaLevanova";
const tgLink=t=>"https://t.me/"+TG+(t?"?text="+encodeURIComponent(t):"");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>Number(n).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" ₽";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
let P=[],R=[],filter="all",curP=null,tab=0,A={P:[],R:[]};

/* ---------- сессия администратора ---------- */
const getS=()=>{try{return JSON.parse(localStorage.getItem("ps_s")||"null")}catch(e){return null}};
const setS=s=>{try{s?localStorage.setItem("ps_s",JSON.stringify(s)):localStorage.removeItem("ps_s")}catch(e){}};
async function token(){
  let s=getS(); if(!s)return null;
  if(s.exp-Date.now()<60000){
    try{const r=await fetch(URL_+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.rt})});
      if(!r.ok)throw 0;const j=await r.json();s={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:s.email};setS(s)}
    catch(e){setS(null);return null}
  }
  return s.at;
}
async function api(path,o={}){
  const h={apikey:KEY,...(o.headers||{})};
  if(o.auth){const t=await token();if(!t)throw new Error("auth");h.Authorization="Bearer "+t}
  if(o.body!==undefined)h["Content-Type"]="application/json";
  const r=await fetch(URL_+path,{method:o.method||"GET",headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  if(!r.ok)throw new Error(await r.text()||r.status);
  return (r.headers.get("content-type")||"").includes("json")?r.json():null;
}
const MIN={Prefer:"return=minimal"};

/* ---------- витрина ---------- */
const prod=id=>P.find(p=>p.id===id);
const revs=id=>R.filter(r=>r.product_id===id);
const avg=id=>{const r=revs(id);return r.length?r.reduce((a,x)=>a+x.rating,0)/r.length:0};
async function loadShop(){
  try{[P,R]=await Promise.all([api("/rest/v1/products?select=*&hidden=eq.false&order=created_at.desc"),api("/rest/v1/reviews?select=*&approved=eq.true&order=created_at.desc")]);$("loaderr").hidden=true}
  catch(e){$("loaderr").hidden=false}
  renderGrid();
}
function renderGrid(){
  $("grid").innerHTML=P.filter(p=>filter==="all"||(filter==="kids"?p.kids:p.color===filter)).map(p=>{const a=avg(p.id);
   return `<article class="card"><button class="pic" data-act="open" data-id="${p.id}" aria-label="Открыть: ${esc(p.title)}"><img src="${esc(p.image_url)}" alt="Футболка «${esc(p.title)}»" loading="lazy"></button>
   <h3>${esc(p.title)}</h3><p class="sub">${esc(p.subtitle)}, ${p.color==="black"?"чёрная":"белая"}${p.kids?", детская":""}${a?`, ${a.toFixed(1)} ★`:""}</p>
   <div class="row"><span class="price">${rub(p.price)}</span><button class="add" data-act="open" data-id="${p.id}">Выбрать</button></div></article>`}).join("")||(P.length||!$("loaderr").hidden?"":'<p class="empty">Каталог скоро пополнится.</p>');
}
const closeModals=()=>$("pm").classList.remove("on");

function openP(id){
  const p=prod(id);if(!p)return;curP=id;const rv=revs(id),a=avg(id);
  $("pmb").innerHTML=`<button class="x close" data-act="closem" aria-label="Закрыть">×</button><img class="big" src="${esc(p.image_url)}" alt="Футболка «${esc(p.title)}»">
  <div class="pi"><h2>${esc(p.title)}</h2><p class="sub">${esc(p.subtitle)}, ${p.color==="black"?"чёрная":"белая"}${p.kids?", детская":""}</p>
  <div class="row"><span class="price">${rub(p.price)}</span></div><a class="go" style="display:block;text-align:center;text-decoration:none;margin-top:12px" target="_blank" rel="noopener" href="${esc(tgLink("Здравствуйте! Меня интересует футболка «"+p.title+"» ("+rub(p.price)+"): "+location.origin+location.pathname+"#shirt-"+p.id))}">Выбрать эту футболку и написать в Telegram</a>
  <h3 style="margin:22px 0 4px">Отзывы${rv.length?` (${rv.length}), средняя оценка ${a.toFixed(1)}`:""}</h3>
  ${rv.map(r=>`<div class="rv"><span class="st" aria-label="Оценка ${r.rating} из 5">${stars(r.rating)}</span> <b>${esc(r.author)}</b><p>${esc(r.body)}</p></div>`).join("")||'<p class="sub">Пока нет отзывов. Будьте первым.</p>'}
  <div class="rf" id="rf"><input id="rn" placeholder="Ваше имя" maxlength="40"><select id="rr" aria-label="Оценка"><option value="5">5, отлично</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><textarea id="rt" rows="3" maxlength="600" placeholder="Что вам понравилось?"></textarea><div class="err" id="re" role="alert"></div><button class="go" data-act="rsend" style="margin:0">Отправить отзыв</button></div></div>`;
  $("pm").classList.add("on");
}
async function sendReview(){
  const author=$("rn").value.trim(),body=$("rt").value.trim();
  if(!author||body.length<3){$("re").textContent="Укажите имя и напишите пару слов об отзыве.";return}
  try{await api("/rest/v1/reviews",{method:"POST",headers:MIN,body:{product_id:curP,author,rating:+$("rr").value,body,approved:false}});
    $("rf").innerHTML='<p class="sub">Спасибо! Отзыв появится на сайте после проверки.</p>'}
  catch(e){$("re").textContent="Не удалось отправить отзыв. Попробуйте позже."}
}
/* ---------- администратор ---------- */
function renderLogin(msg){
  $("adminView").innerHTML=`<h2 style="font:italic 500 32px 'Cormorant Garamond',Georgia,serif;margin:10px 0 14px">Вход для администратора</h2>
  <div class="addp" style="max-width:380px"><input id="le" type="email" placeholder="Почта" autocomplete="username"><input id="lp" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="lerr" role="alert">${esc(msg||"")}</div><button class="go" style="margin:0" data-act="login">Войти</button></div>`;
}
async function login(){
  try{const r=await fetch(URL_+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("le").value.trim(),password:$("lp").value})});
    const j=await r.json();if(!r.ok)throw 0;
    setS({at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,email:j.user&&j.user.email});route()}
  catch(e){$("lerr").textContent="Не удалось войти. Проверьте почту и пароль."}
}
async function loadAdmin(){
  try{[A.P,A.R]=await Promise.all([api("/rest/v1/products?select=*&order=created_at.desc",{auth:true}),api("/rest/v1/reviews?select=*&order=created_at.desc",{auth:true})]);return true}
  catch(e){setS(null);return false}
}
const ptitle=id=>(A.P.find(p=>p.id===id)||{title:"удалённой футболке"}).title;
function renderAdmin(note){
  const newR=A.R.filter(r=>!r.approved).length;
  let b="";
  if(tab===0){
    b=`<div class="addp"><h3>Новая футболка</h3><input type="file" id="nf" accept="image/*" aria-label="Фото"><input id="nt" placeholder="Название"><input id="ns" placeholder="Подпись, например: Именной принт"><div class="two"><select id="nc"><option value="black">Чёрная</option><option value="white">Белая</option></select><input id="np" type="number" min="0" value="3000" aria-label="Цена"><label class="ck"><input type="checkbox" id="nk">детская</label></div><div class="err" id="ae" role="alert"></div><button class="go" style="margin:0" data-act="padd">Добавить в каталог</button></div>`+
    A.P.map(p=>`<div class="ar"><img src="${esc(p.image_url)}" alt=""><div><input data-f="title" data-id="${p.id}" value="${esc(p.title)}" aria-label="Название"><div class="two"><input data-f="price" data-id="${p.id}" type="number" min="0" value="${p.price}" aria-label="Цена"><label class="ck"><input type="checkbox" data-f="hidden" data-id="${p.id}"${p.hidden?" checked":""}>скрыть</label><label class="ck"><input type="checkbox" data-f="kids" data-id="${p.id}"${p.kids?" checked":""}>детская</label></div></div><button class="rm" data-act="pdel" data-id="${p.id}">Удалить</button></div>`).join("");
  }else{
    b=A.R.map(r=>`<div class="rv"><span class="st">${stars(r.rating)}</span> <b>${esc(r.author)}</b> <span class="tag">о «${esc(ptitle(r.product_id))}», ${r.approved?"на сайте":"ждёт проверки"}</span><p>${esc(r.body)}</p>
    <div class="two">${r.approved?"":`<button class="add" data-act="rok" data-id="${r.id}">Показать на сайте</button>`}<button class="rm" data-act="rdel" data-id="${r.id}">Удалить</button></div></div>`).join("")||'<p class="sub">Отзывов пока нет.</p>';
  }
  $("adminView").innerHTML=`<h2 style="font:italic 500 32px 'Cormorant Garamond',Georgia,serif;margin:10px 0 14px">Управление</h2>
  <div class="tabs">${["Товары","Отзывы"+(newR?` (${newR})`:"")].map((t,i)=>`<button class="chip" data-act="tab" data-v="${i}" aria-pressed="${i===tab}">${t}</button>`).join("")}</div>
  <p class="tag" id="note" role="status">${esc(note||"")}</p>${b}`;
}
const readImg=f=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};im.src=r.result};r.readAsDataURL(f)});
async function upload(blob){
  const t=await token();if(!t)throw new Error("auth");
  const name=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2))+".jpg";
  const r=await fetch(URL_+"/storage/v1/object/products/"+name,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"image/jpeg"},body:blob});
  if(!r.ok)throw new Error(await r.text());
  return URL_+"/storage/v1/object/public/products/"+name;
}
const patch=(table,id,body)=>api(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",auth:true,headers:MIN,body});
const del=(table,id)=>api(`/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",auth:true,headers:MIN});
async function refresh(note){await loadAdmin();renderAdmin(note)}
async function act(d,t){
  try{switch(d.act){
   case"login":await login();break;
   case"tab":tab=+d.v;renderAdmin();break;
   case"padd":{const f=$("nf").files[0],n=$("nt").value.trim();
     if(!f||!n){$("ae").textContent="Выберите фото и введите название.";break}
     t.disabled=true;t.textContent="Загружаем…";
     const url=await upload(await readImg(f));
     await api("/rest/v1/products",{method:"POST",auth:true,headers:MIN,body:{title:n,subtitle:$("ns").value.trim()||"Принт",color:$("nc").value,price:+$("np").value||0,image_url:url,...($("nk").checked?{kids:true}:{})}});
     await refresh("Футболка добавлена");break}
   case"pdel":if(confirm("Удалить футболку из каталога?")){await del("products",d.id);await refresh("Удалено")}break;
   case"rok":await patch("reviews",d.id,{approved:true});await refresh("Отзыв показан на сайте");break;
   case"rdel":if(confirm("Удалить отзыв?")){await del("reviews",d.id);await refresh("Удалено")}break;
  }}catch(e){
    if(String(e.message)==="auth"){setS(null);route();return}
    renderAdmin("Не получилось: "+String(e.message).slice(0,160));
  }
}

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  if(e.target.classList&&e.target.classList.contains("modal")){closeModals();return}
  const t=e.target.closest("[data-act]");if(!t)return;const d=t.dataset,k=+d.k;
  switch(d.act){
   case"open":openP(d.id);break;
   case"closem":closeModals();break;
   case"flt":filter=d.v;document.querySelectorAll(".filters .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===filter));renderGrid();break;
   case"rsend":sendReview();break;
   default:act(d,t);
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.f&&t.dataset.id){
    const v=(t.dataset.f==="hidden"||t.dataset.f==="kids")?t.checked:t.dataset.f==="price"?(+t.value||0):t.value.trim();
    try{await patch("products",t.dataset.id,{[t.dataset.f]:v});$("note").textContent="Сохранено"}catch(x){$("note").textContent="Не удалось сохранить"}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModals()}
  if(e.key==="Enter"&&(e.target.id==="le"||e.target.id==="lp"))login();
});
$("out").onclick=()=>{setS(null);location.hash="";route()};

async function route(){
  const adm=location.hash==="#admin";
  $("shop").hidden=adm;$("adminView").hidden=!adm;$("tgbtn").hidden=adm;$("back").hidden=!adm;$("out").hidden=!(adm&&getS());
  closeModals();
  if(adm){
    if(getS()){$("adminView").innerHTML='<p class="sub">Загружаем…</p>';if(await loadAdmin()){$("out").hidden=false;renderAdmin()}else{$("out").hidden=true;renderLogin("Сессия закончилась, войдите снова.")}}
    else renderLogin();
  }else{await loadShop();const m=location.hash.match(/^#shirt-(.+)$/);if(m&&prod(m[1]))openP(m[1])}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("tgbtn").href=tgLink();
route();
</script>
</body>
